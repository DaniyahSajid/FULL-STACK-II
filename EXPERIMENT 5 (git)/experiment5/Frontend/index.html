<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 5.2 - User Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Experiment 5.2</h1>
    <h2>Global Exception Handling & Structured Logging</h2>

    <div class="card">
        <h3>User Management</h3>

        <form id="userForm">

            <label for="uid">UID</label>
            <input
                type="text"
                id="uid"
                placeholder="Enter UID"
                required
            >

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter Name"
                required
            >

            <div class="buttons">

                <button type="submit" class="btn-add">
                    Add User
                </button>

                <button
                    type="button"
                    class="btn-update"
                    onclick="updateUser()">
                    Update User
                </button>

                <button
                    type="button"
                    class="btn-clear"
                    onclick="clearForm()">
                    Clear
                </button>

            </div>

        </form>
    </div>

    <div class="card">

        <h3>Search User</h3>

        <div class="search-box">

            <input
                type="text"
                id="searchUid"
                placeholder="Enter UID to search"
            >

            <button
                type="button"
                class="btn-search"
                onclick="searchUser()">
                Search
            </button>

        </div>

        <div id="searchResult"></div>

    </div>

    <div class="card">

        <div class="table-header">

            <h3>Users</h3>

            <button
                type="button"
                class="btn-refresh"
                onclick="loadUsers()">
                Refresh Users
            </button>

        </div>

        <table>

            <thead>
                <tr>
                    <th>UID</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="userTableBody"></tbody>

        </table>

    </div>

    <div id="message"></div>

</div>

<script src="script.js"></script>

</body>
</html>
