
name: Experiment 9 CD

on:
  workflow_run:
    workflows: ["Experiment 9 CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Experiment 9/experiment9/Experiment 9 (git)/experiment9
          file: ./Experiment 9/experiment9/Experiment 9 (git)/experiment9/Dockerfile
          push: true
          tags: |
            ghcr.io/daniyahsajid/experiment9:latest
            ghcr.io/daniyahsajid/experiment9:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Canary rollout simulation
        run: |
          echo "Stage 1: simulate sending 10% of traffic to the new version"
          echo "Stage 2: validate health and error rates"
          echo "Stage 3: simulate expansion to 100%"
          echo "Simulation only: no live deployment or traffic routing is configured."
