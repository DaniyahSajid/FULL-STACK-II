
name: Experiment 9 CI

on:
  push:
    branches: [main]
    paths:
      - 'Experiment 9/experiment9/**'
      - '.github/workflows/experiment9-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Experiment 9/experiment9/Experiment 9 (git)/experiment9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'Experiment 9/experiment9/Experiment 9 (git)/experiment9/pom.xml'

      - name: Run Maven tests
        run: chmod +x mvnw && ./mvnw --batch-mode clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment9-test-reports
          path: 'Experiment 9/experiment9/Experiment 9 (git)/experiment9/target/surefire-reports/'
          if-no-files-found: warn
